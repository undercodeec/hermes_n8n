name: Hermes backend - build and publish GHCR (manual)

# This workflow never deploys to the VPS and never runs on push.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Approved full 40-character source commit SHA (must match pilot branch HEAD)"
        required: true
        type: string
        default: "c722b36754272f96a25591555417eb44a80807ce"
      expected_tree:
        description: "Approved source Git tree SHA"
        required: true
        type: string
        default: "758945ce5a08fb58499ff9cc4213e758ff5398db"

permissions:
  contents: read
  packages: write

concurrency:
  group: hermes-backend-ghcr-manual
  cancel-in-progress: false

jobs:
  build-and-publish:
    # The manual workflow must be dispatched from main; the source comes from the reviewed pilot commit.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Verify approved source is the exact pilot branch HEAD
        env:
          SOURCE_SHA_INPUT: ${{ inputs.source_sha }}
          EXPECTED_TREE_INPUT: ${{ inputs.expected_tree }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid commit SHA"; exit 1; }
          [[ "$EXPECTED_TREE_INPUT" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid tree SHA"; exit 1; }
          pilot_ref="refs/heads/pilot/a7-d12-monitor-only-20261026"
          remote_sha="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" "$pilot_ref" | cut -f1)"
          [[ -n "$remote_sha" && "$remote_sha" == "$SOURCE_SHA_INPUT" ]] || {
            echo "Candidate commit does not match remote pilot branch HEAD"
            exit 1
          }
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hermes-backend"
          tag="${SOURCE_SHA_INPUT}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          echo "SOURCE_SHA=$SOURCE_SHA_INPUT" >> "$GITHUB_ENV"
          echo "EXPECTED_TREE=$EXPECTED_TREE_INPUT" >> "$GITHUB_ENV"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image:$tag" >> "$GITHUB_ENV"

      - name: Check out exact approved commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false

      - name: Verify source commit and tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$EXPECTED_TREE"
          test -f hermes-backend/Dockerfile
          test -f hermes-backend/prisma/migrations/20261026190000_nous_durable_continuation/migration.sql

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish approved linux/amd64 image
        id: publish
        uses: docker/build-push-action@v6
        with:
          context: ./hermes-backend
          file: ./hermes-backend/Dockerfile
          platforms: linux/amd64
          pull: true
          push: true
          tags: ${{ env.IMAGE_TAG }}
          build-args: |
            GIT_COMMIT=${{ env.SOURCE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/undercodeec/hermes_n8n
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}

      - name: Verify published image digest and OCI revision
        env:
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing digest"; exit 1; }
          docker buildx imagetools inspect "$IMAGE@$PUBLISHED_DIGEST"
          docker pull --platform linux/amd64 "$IMAGE_TAG"
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE_TAG")" = "linux/amd64"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE_TAG")" = "$SOURCE_SHA"
          {
            echo "## Hermes GHCR image published (no VPS deployment)"
            echo ""
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Source tree: \`$EXPECTED_TREE\`"
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Immutable image reference: \`$IMAGE@$PUBLISHED_DIGEST\`"
            echo "- Platform: \`linux/amd64\`"
            echo ""
            echo "Check GHCR package visibility and access before any VPS pull."
          } >> "$GITHUB_STEP_SUMMARY"
