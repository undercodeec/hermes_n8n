# Entorno exclusivo para las pruebas de integración del learning loop.
# No reutiliza nombres, red, puertos ni volúmenes del compose de producción.
name: hermes-learning-test

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learning_test
      POSTGRES_PASSWORD: learning_test_only
      POSTGRES_DB: hermes_learning_test
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - learning_test_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learning_test -d hermes_learning_test']
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports:
      - '127.0.0.1:56379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

volumes:
  learning_test_pgdata:
