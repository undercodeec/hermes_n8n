services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hermes-app
    restart: unless-stopped
    env_file:
      - ${HERMES_BACKEND_ENV_FILE:?Set HERMES_BACKEND_ENV_FILE to a root-readable file outside Git}
    environment:
      PORT: 3003
    secrets:
      - source: nous_hermes_api_key
        target: nous_hermes_api_key
        mode: 0400
    networks:
      - default
      - hermes_client_api
    ports:
      - '3003:3003'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    container_name: hermes-postgres
    restart: unless-stopped
    env_file:
      - ${POSTGRES_ENV_FILE:?Set POSTGRES_ENV_FILE to a root-readable file outside Git}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - hermes_pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: hermes-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - hermes_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: ${N8N_IMAGE:?Set N8N_IMAGE to the exact digest already running on the VPS}
    container_name: hermes-n8n
    restart: unless-stopped
    env_file:
      - ${N8N_ENV_FILE:?Set N8N_ENV_FILE to a root-readable file outside Git}
    ports:
      - '127.0.0.1:5678:5678'
    environment:
      N8N_HOST: n8n.undercodeec.com
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.undercodeec.com/
      GENERIC_TIMEZONE: America/Guayaquil
      TZ: America/Guayaquil
      N8N_RUNNERS_ENABLED: 'true'
      N8N_SECURE_COOKIE: 'true'
      N8N_PROXY_HOPS: '1'
      # Permite require('crypto') dentro del Code node (nodo Verify HMAC).
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      # Permite que los nodos Code accedan a vars de entorno via $env.VAR_NAME.
      N8N_BLOCK_ENV_ACCESS_IN_NODE: 'false'
    volumes:
      - hermes_n8n_data:/home/node/.n8n
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -q -O - http://localhost:5678/healthz || exit 1']
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  hermes_pgdata:
    driver: local
  hermes_redis_data:
    driver: local
  hermes_n8n_data:
    driver: local

secrets:
  nous_hermes_api_key:
    file: /etc/hermes-agent-client/api-key

networks:
  hermes_client_api:
    external: true
