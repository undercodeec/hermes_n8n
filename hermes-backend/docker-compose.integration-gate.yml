services:
  postgres-main:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: learning_test
      POSTGRES_PASSWORD: fixture-learning-local
      POSTGRES_DB: hermes_learning_test
    ports: ['127.0.0.1:55432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U learning_test -d hermes_learning_test']
      interval: 2s
      timeout: 2s
      retries: 30

  redis-main:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:56379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-a7:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a7_d16_test
      POSTGRES_PASSWORD: fixture-a7-d16-local
      POSTGRES_DB: hermes_a7_d16_test
    ports: ['127.0.0.1:55433:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U a7_d16_test -d hermes_a7_d16_test']
      interval: 2s
      timeout: 2s
      retries: 30

  redis-a7:
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    ports: ['127.0.0.1:56380:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-a3:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a3_gate
      POSTGRES_PASSWORD: fixture-a3-local
      POSTGRES_DB: hermes_a3_temp
    ports: ['127.0.0.1:55439:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U a3_gate -d hermes_a3_temp']
      interval: 2s
      timeout: 2s
      retries: 30

  postgres-a6:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: a6_gate
      POSTGRES_PASSWORD: fixture-a6-local
      POSTGRES_DB: hermes_a6_d1_temp
    ports: ['127.0.0.1:55888:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U a6_gate -d hermes_a6_d1_temp']
      interval: 2s
      timeout: 2s
      retries: 30
