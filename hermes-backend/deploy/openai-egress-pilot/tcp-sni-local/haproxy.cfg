global
  log stdout format raw local0
defaults
  log global
  mode tcp
  timeout connect 2s
  timeout client 5s
  timeout server 5s
frontend synthetic_sni
  bind :8443
  tcp-request inspect-delay 3s
  tcp-request content accept if { req.ssl_hello_type 1 } { req.ssl_sni -i api.synthetic.test }
  tcp-request content reject if { req.ssl_hello_type 1 }
  tcp-request content reject
  default_backend synthetic_upstream
backend synthetic_upstream
  server synthetic api.synthetic.test:8443
